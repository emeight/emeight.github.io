<!-- note card component -->
<a class="note" href="/notes/{{slug}}">
    <div class="icon">
        <div class="checkerboard">
            {{checkerboard}}
        </div>
        <p>{{serial}}</p>
    </div>
    <div class="info">
        <h6>{{kicker}}</h6>
        <h2>{{title}}</h2>
        <p>{{description}}</p>
    </div>
    <div class="extra">
        <div class="date">{{date}}</div>
        <svg><use href="/assets/icons/arrows.svg#arrow-right"/></svg>
    </div>
</a>
